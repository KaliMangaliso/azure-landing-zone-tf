name: Terraform CI/CD (dev)

on:
  push:
    branches:
      - main
    paths:
      - "envs/dev/**"
      - "modules/**"
  pull_request:
    paths:
      - "envs/dev/**"
      - "modules/**"

jobs:
  terraform:
    name: "Terraform Dev Deployment"
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Azure Login
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.7.5

    - name: Terraform Init
      working-directory: envs/dev
      run: terraform init

    - name: Terraform Validate
      working-directory: envs/dev
      run: terraform validate

    - name: Terraform Plan
      working-directory: envs/dev
      run: terraform plan

    - name: Terraform Apply (Auto Deploy Dev)
      if: github.ref == 'refs/heads/main'
      working-directory: envs/dev
      run: terraform apply -auto-approve